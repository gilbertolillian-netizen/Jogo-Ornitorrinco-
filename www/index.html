<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ornitorrinco Troll</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#1b1f2a;--fg:#f4f1e8;--btn:#ffffff26;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#10131a}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
body{display:flex;flex-direction:column}
#g{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{image-rendering:pixelated;border-radius:6px}
#ctl{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;height:80px}
#ctl div{display:flex;gap:12px}
button{background:var(--btn);color:var(--fg);border:2px solid #ffffff33;border-radius:20px;font-size:22px;height:64px;min-width:80px;touch-action:none}
button:active{background:#ffffff55}
#bj{min-width:130px;font-weight:700;font-size:18px}
</style>
</head>
<body>
<div id="g"><canvas id="c" width="640" height="360"></canvas></div>
<div id="ctl"><div><button id="bl">◀</button><button id="br">▶</button></div><button id="bj">PULAR</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=640,H=360,LW=2350;
const keys={l:0,r:0,j:0};
function bind(id,k){const e=document.getElementById(id);
 e.addEventListener('pointerdown',ev=>{ev.preventDefault();keys[k]=1});
 ['pointerup','pointerleave','pointercancel'].forEach(n=>e.addEventListener(n,()=>keys[k]=0));}
bind('bl','l');bind('br','r');bind('bj','j');
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
addEventListener('keydown',e=>{if(km[e.code]){keys[km[e.code]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(km[e.code])keys[km[e.code]]=0});
function rs(){const h=document.getElementById('ctl').offsetHeight+(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0)+(parseFloat(getComputedStyle(document.documentElement).paddingBottom)||0);
 const s=Math.min(innerWidth/W,(innerHeight-h)/H);c.style.width=W*s+'px';c.style.height=H*s+'px'}
addEventListener('resize',rs);rs();

let P,Hz,En,pl,cam,state,msg,wait,deaths=0,tm=0,go=0,tot=0,best=null;
try{best=parseFloat(localStorage.getItem('ornitoBest'))||null}catch(e){}
function fmt(f){const s=f/60,m=Math.floor(s/60);return m?m+':'+(s%60).toFixed(1).padStart(4,'0'):s.toFixed(1)+'s'}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function init(){
 P=[[0,300,400,60,'g'],[400,300,60,60,'fall'],[460,300,300,60,'g'],[860,300,440,60,'g'],[1330,262,56,12,'fake'],[1400,300,950,60,'g'],[1600,240,40,60,'g'],[600,212,32,32,'hid']]
  .map(([x,y,w,h,t])=>({x,y,w,h,t,vy:0,on:0,gone:0,vis:t!='hid'}));
 Hz=[{x:590,y:284,w:40,h:16,t:'s',sh:1},{x:940,y:284,w:48,h:16,t:'pop',sh:0,trig:34},{x:1700,y:-30,w:36,h:30,t:'drop',sh:1,trig:38,f:0}];
 En=[{x:1000,y:272,w:26,h:28,vx:-.8,a:880,b:1270,bad:0},{x:1150,y:272,w:26,h:28,vx:-.8,a:880,b:1270,bad:1},{x:2000,y:272,w:26,h:28,vx:-.9,a:1900,b:2200,bad:1}];
 pl={x:40,y:270,w:22,h:26,vx:0,vy:0,g:0,f:1};
 cam=0;state='play';msg='';wait=0;tm=0;go=0;
}
function die(m){if(state!='play')return;state='dead';deaths++;tot+=tm;msg=m;wait=40}
function step(){
 if(state!='play'){wait--;if(wait<0&&keys.j){if(state=='win')tot=0;init()}return}
 const p=pl;if(!go&&(keys.l||keys.r||keys.j))go=1;if(go)tm++;
 p.vx=(keys.r-keys.l)*3;if(p.vx)p.f=p.vx>0?1:-1;
 if(keys.j&&p.g){p.vy=-10;p.g=0}
 p.vy=Math.min(p.vy+.5,12);
 p.x=Math.max(0,p.x+p.vx);
 for(const b of P){if(b.gone||!hit(p,b))continue;if(p.vx>0)p.x=b.x-p.w;else if(p.vx<0)p.x=b.x+b.w}
 p.y+=p.vy;p.g=0;
 for(const b of P){if(b.gone||!hit(p,b))continue;
  if(p.vy>0){p.y=b.y-p.h;p.vy=0;p.g=1;if(b.t=='fake')b.on=1}
  else if(p.vy<0){p.y=b.y+b.h;p.vy=0;b.vis=1}}
 for(const b of P){
  if(b.t=='fake'&&b.on&&++b.on>8)b.gone=1;
  if(b.t=='fall'&&p.x>b.x-35)b.fl=1;
  if(b.fl){b.vy+=.6;b.y+=b.vy}}
 for(const h of Hz){
  const d=Math.abs(p.x+p.w/2-(h.x+h.w/2));
  if(h.t=='pop'&&d<h.trig)h.sh=1;
  if(h.t=='drop'&&d<h.trig)h.f=1;
  if(h.f)h.y+=7;
  if(h.sh&&hit(p,h))die(h.t=='s'?"O bloco invisível te empurrou pro espinho!":"O chão tinha espinhos. Claro que tinha.")}
 for(const e of En){if(e.dead)continue;
  e.x+=e.vx;if(e.x<e.a||e.x>e.b)e.vx*=-1;
  if(hit(p,e)){
   if(p.vy>0&&p.y+p.h-e.y<16){if(e.bad)die("Aquele inimigo não era pisável!");else{e.dead=1;p.vy=-7}}
   else die("Um bichinho fofo te pegou.")}}
 if(p.x+p.w>1840&&p.x<1870&&p.y>190)die("Era uma bandeira falsa!");
 if(p.x+p.w>2280){state='win';tot+=tm;const rec=!best||tm<best;if(rec){best=tm;try{localStorage.setItem('ornitoBest',best)}catch(e){}}msg=rec?"Você venceu! Novo recorde!":"Você venceu!";wait=40}
 if(p.y>H+40)die("Você caiu no buraco. Ele estava lá o tempo todo.");
 cam=Math.max(0,Math.min(LW-W,p.x-220));
}
function flag(fx){x.fillStyle='#ddd';x.fillRect(fx-cam,190,4,110);x.fillStyle='#2dbd4e';x.beginPath();x.moveTo(fx+4-cam,192);x.lineTo(fx+34-cam,206);x.lineTo(fx+4-cam,220);x.fill()}
function platypus(p){
 x.save();x.translate(p.x-cam+p.w/2,p.y);x.scale(p.f,1);
 x.fillStyle='#4f3a26';x.beginPath();x.ellipse(-12,19,8,3.5,0,0,7);x.fill();
 x.fillStyle='#7b5a3c';x.beginPath();x.ellipse(0,16,11,9,0,0,7);x.fill();
 x.beginPath();x.arc(4,8,8,0,7);x.fill();
 x.fillStyle='#b89468';x.beginPath();x.ellipse(2,19,6,4,0,0,7);x.fill();
 x.fillStyle='#f0a030';x.beginPath();x.ellipse(13,11,8,3.5,0,0,7);x.fill();x.fillStyle='#c27a1a';x.fillRect(16,9.5,1.5,1.5);
 const wl=pl.vx&&pl.g?Math.sin(fr*.4)*3:0;x.fillRect(-6+wl,23,6,3);x.fillRect(3-wl,23,6,3);
 x.fillStyle='#fff';x.beginPath();x.arc(6,6,2.4,0,7);x.fill();
 x.fillStyle='#000';x.beginPath();x.arc(7,6,1.2,0,7);x.fill();
 x.restore()}
function draw(){
 const sg=x.createLinearGradient(0,0,0,H);sg.addColorStop(0,'#5fb4ee');sg.addColorStop(1,'#bfe8ff');x.fillStyle=sg;x.fillRect(0,0,W,H);
 x.fillStyle='#8fd0a0';for(let i=-1;i<6;i++){const hx=i*240-(cam*.3)%240;x.beginPath();x.ellipse(hx+120,305,150,70,0,Math.PI,0);x.fill()}
 x.fillStyle='#ffffffdd';[[120,60],[420,40],[800,70],[1200,50],[1700,60]].forEach(([a,b])=>{const q=a-cam*.5;[[0,8,14],[22,0,18],[46,8,14]].forEach(([dx,dy,r])=>{x.beginPath();x.arc(q+dx,b+dy,r,0,7);x.fill()})});
 for(const b of P){if(b.gone||!b.vis)continue;
  x.fillStyle=b.t=='g'||b.t=='fall'?'#8a5a2b':b.t=='fake'?'#c98d3f':'#d9a441';x.fillRect(b.x-cam,b.y,b.w,b.h);
  if(b.t!='g'&&b.t!='fall'){x.fillStyle='#0003';x.fillRect(b.x-cam,b.y+b.h-3,b.w,3);x.fillRect(b.x-cam+b.w/2,b.y,2,b.h)}
  if(b.t=='g'||b.t=='fall'){x.fillStyle='#3fae49';x.fillRect(b.x-cam,b.y,b.w,8);x.fillStyle='#5fd068';x.fillRect(b.x-cam,b.y,b.w,3);x.fillStyle='#6b4420';for(let i=8;i<b.w;i+=26){x.fillRect(b.x+i-cam,b.y+20+(i*7)%24,6,4)}}}
 x.fillStyle='#2dbd4e';x.fillRect(1600-cam,240,40,60);x.fillRect(1596-cam,236,48,12);
 flag(1850);flag(2290);
 for(const h of Hz){if(!h.sh)continue;x.fillStyle='#9aa0a6';
  for(let i=0;i<h.w;i+=10){x.beginPath();if(h.t=='drop'){x.moveTo(h.x+i-cam,h.y);x.lineTo(h.x+i+10-cam,h.y);x.lineTo(h.x+i+5-cam,h.y+h.h)}else{x.moveTo(h.x+i-cam,h.y+h.h);x.lineTo(h.x+i+10-cam,h.y+h.h);x.lineTo(h.x+i+5-cam,h.y)}x.fill()}}
 for(const e of En){if(e.dead)continue;x.fillStyle='#b5651d';x.beginPath();x.ellipse(e.x+13-cam,e.y+16,13,12,0,0,7);x.fill();
  x.fillStyle='#fff';x.fillRect(e.x+6-cam,e.y+8,5,5);x.fillRect(e.x+16-cam,e.y+8,5,5);x.fillStyle='#000';x.fillRect(e.x+8-cam,e.y+10,2,3);x.fillRect(e.x+18-cam,e.y+10,2,3);x.fillRect(e.x+5-cam,e.y+5,8,2);x.fillRect(e.x+15-cam,e.y+5,8,2);x.fillStyle='#5a3410';x.fillRect(e.x+2-cam,e.y+25,9,4);x.fillRect(e.x+15-cam,e.y+25,9,4)}
 platypus(pl);
 x.fillStyle='#000a';x.beginPath();x.roundRect(8,8,76,26,10);x.fill();x.fillStyle='#fff';x.font='14px system-ui';x.fillText('💀 '+deaths,18,26);
 x.fillStyle='#000a';x.beginPath();x.roundRect(W/2-52,8,104,26,10);x.fill();x.fillStyle='#fff';x.textAlign='center';x.font='bold 15px system-ui';x.fillText('⏱ '+fmt(tm),W/2,26);x.textAlign='left';x.font='14px system-ui';
 x.fillStyle='#0005';x.fillRect(W-170,16,152,8);x.fillStyle='#ffd23f';x.fillRect(W-169,17,150*Math.min(1,pl.x/2280),6);
 if(state!='play'){x.fillStyle='#000c';x.beginPath();x.roundRect(120,120,400,110,16);x.fill();x.strokeStyle='#ffd23f';x.lineWidth=2;x.stroke();x.fillStyle='#fff';x.textAlign='center';
  x.font='bold 18px system-ui';x.fillText(msg,320,160,380);x.font='14px system-ui';
  const ls=state=='win'?['Tempo: '+fmt(tm)+' · Total com mortes: '+fmt(tot),'Melhor: '+fmt(best)+' · Mortes: '+deaths,'Toque em PULAR para jogar de novo']:['Tempo nesta tentativa: '+fmt(tm),'Toque em PULAR para tentar de novo'];ls.forEach((t,i)=>x.fillText(t,320,184+i*20,380));x.textAlign='left'}
}
let last=0,acc=0,fr=0;
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=1000/60){step();acc-=1000/60}fr++;draw();requestAnimationFrame(loop)}
init();requestAnimationFrame(loop);
</script>
</body>
</html>
